login_image:
  timeout: "Timed out waiting for login image (%{timeout:?})"
  save_failed: "Failed to save login image: %{e}"
  could_not_auto_open: "Could not auto-open: %{e}. Please open the file manually."

utils:
  timeout: "Timed out after %{duration:?}"
