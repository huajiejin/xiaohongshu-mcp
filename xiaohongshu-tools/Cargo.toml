[package]
name = "xiaohongshu-tools"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "xhs"
path = "src/bin/xiaohongshu-cli/main.rs"

[dependencies]
anyhow = "1.0.102"
chromiumoxide = "0.9.1"
clap = { version = "4.6.0", features = ["derive"] }
dirs = "6.0.0"
futures = "0.3.32"
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
